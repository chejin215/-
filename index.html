let selectedAllergies = new Set();
let currentWeek = 1;

function initAllergyFilters(){
  const container = document.getElementById("allergy-checkboxes");
  container.innerHTML = Object.entries(ALLERGY_MAP)
    .map(([code,name]) =>
      `<label class="allergy-item">
        <input type="checkbox" value="${code}" onchange="toggleAllergy('${code}')">
        <span>${code}. ${name}</span>
      </label>`
    ).join("");
}

function toggleAllergy(code){
  const n = Number(code);
  if(selectedAllergies.has(n)) selectedAllergies.delete(n);
  else selectedAllergies.add(n);
  renderMealTable();
}

function resetAllergies(){
  selectedAllergies.clear();
  document.querySelectorAll("#allergy-checkboxes input")
    .forEach(cb => cb.checked = false);
  renderMealTable();
}

function toggleDropdown(){
  document.getElementById("weekDropdown").classList.toggle("show");
}

function selectWeek(weekNum){
  currentWeek = weekNum;
  document.getElementById("current-week-label").innerText =
    weekNum + "주차 식단";
  document.getElementById("display-week-title").innerText =
    menuData[weekNum].title;

  document.querySelectorAll("#weekDropdown button").forEach((btn,idx)=>{
    btn.classList.toggle("active",idx+1===weekNum);
  });

  document.getElementById("weekDropdown").classList.remove("show");
  renderMealTable();
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,ch=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}

function renderItems(items){
  if(!items || !items.length) return "";

  return items.map(item=>{
    const conflict = item.allergies.some(code =>
      selectedAllergies.has(code)
    );

    const badges = item.allergies.map(code =>
      `<span class="allergy-badge ${
        selectedAllergies.has(code) ? "danger" : ""
      }">${ALLERGY_MAP[code] || code}</span>`
    ).join("");

    return `<div class="menu-item ${
      conflict ? "highlight-danger" : ""
    }">
      <strong>${escapeHTML(item.menu)}</strong>
      ${badges ? `<div>${badges}</div>` : ""}
    </div>`;
  }).join("");
}

function renderMealTable(){
  const selected = menuData[currentWeek];
  let out = '<table class="meal-table"><thead><tr>';

  selected.days.forEach(d=>{
    out += `<th>
      <div class="day-date">${d.date} (${d.day})</div>
      ${d.note ? `<div class="day-note">[${escapeHTML(d.note)}]</div>` : ""}
    </th>`;
  });

  out += '</tr></thead><tbody><tr>';

  selected.days.forEach(d=>{
    out += '<td>';

    if(!d.lunch.length && !d.dinner.length){
      out += '<div class="no-meal">급식 없음</div>';
    }

    if(d.lunch.length){
      out += `<div class="meal-type">☀️ 중식</div>
        <div class="menu-group">${renderItems(d.lunch)}</div>`;
    }

    if(d.dinner.length){
      out += `<div class="meal-type dinner">🌙 석식</div>
        <div class="menu-group">${renderItems(d.dinner)}</div>`;
    }

    out += '</td>';
  });

  out += '</tr></tbody></table>';
  document.getElementById("meal-content").innerHTML = out;
}

document.getElementById("dropdownBtn")
  .addEventListener("click",toggleDropdown);

window.addEventListener("click",event=>{
  if(!event.target.closest(".week-select-wrapper")){
    document.getElementById("weekDropdown").classList.remove("show");
  }
});

initAllergyFilters();
selectWeek(1);
</script>
